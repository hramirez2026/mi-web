<!doctype html>
<html data-bs-theme="dark">
    <head>
        <meta charset=utf-8>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Productos - Demo Meta Pixel</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel=stylesheet>
        <link href="css/styles.css" rel=stylesheet>
        <script>
            !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
            fbq('init','2905036683191707');
            fbq('track','PageView');
        </script>
    </head>
    <body>
        <nav class='navbar custom-nav sticky-top'>
            <div class='container'>
                <a href='index.html' class='navbar-brand fw-bold text-white'>Inicio</a>
                <button class="btn btn-primary position-relative" type="button" data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas" aria-controls="cartOffcanvas">
                    🛒 <span id='cantidad' class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                </button>
            </div>
        </nav>
        <div class='container mt-5 mb-5'>
            <h2 class="mb-4 text-center">Nuestros Productos</h2>
            <div class='row g-4' id='productos'></div>
        </div>

        <!-- Offcanvas for Cart -->
        <div class="offcanvas offcanvas-end" tabindex="-1" id="cartOffcanvas" aria-labelledby="cartOffcanvasLabel">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="cartOffcanvasLabel">Tu Carrito</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body d-flex flex-column">
                <div id="cart-items" class="flex-grow-1 overflow-auto">
                    <p class="text-center text-muted mt-4">Tu carrito está vacío.</p>
                </div>
                <div class="mt-auto border-top border-secondary pt-3">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span>Total:</span>
                        <span class="cart-total" id="cart-total">$0</span>
                    </div>
                    <button class="btn btn-success w-100" id="btn-comprar" onclick="comprar()">Comprar</button>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script src='js/app.js'></script>
    </body>
</html>
