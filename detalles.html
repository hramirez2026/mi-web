<!doctype html>
<html data-bs-theme="dark">
    <head>
        <meta charset=utf-8>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Detalles - Meta Pixel</title>

        <meta property="og:title" content="Detalles - Meta Pixel" />
        <meta property="og:description" content="Detalles - Meta Pixel" />
        <meta property="og:url" content="https://hramirez2026.github.io/meta-pixel-demo/detalles.html" />
        <meta property="og:image" content="https://hramirez2026.github.io/meta-pixel-demo/img/mic.svg" />
        <meta property="og:type" content="website" />
        
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel=stylesheet>
        <link href="css/styles.css" rel=stylesheet>
        <!-- Meta Pixel Code -->
        <script>
            !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
            fbq('init','2905036683191707');
            fbq('track','PageView');
        </script>
    </head>
    <body>
        <nav class='navbar custom-nav sticky-top'>
            <div class='container'>
                <a href='index.html' class='navbar-brand fw-bold text-white'>Inicio</a>
                <div>
                    <a href='productos.html' class='btn btn-outline-light me-2'>Catálogo</a>
                    <button class="btn btn-primary position-relative" type="button" data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas" aria-controls="cartOffcanvas">
                        🛒 <span id='cantidad' class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                    </button>
                </div>
            </div>
        </nav>
        
        <div class='container mt-5 mb-5' id="detail-container">
            <div class="row justify-content-center">
                <div class="col-md-10">
                    <div class="glass-card overflow-hidden">
                        <div class="row g-0">
                            <div class="col-md-6">
                                <img id="detail-img" src="" class="img-fluid h-100 w-100" alt="Producto" style="object-fit: cover; min-height: 400px;">
                            </div>
                            <div class="col-md-6 p-4 p-md-5 d-flex flex-column justify-content-center">
                                <span class="badge bg-primary mb-3 align-self-start fs-6" id="detail-category">Categoría</span>
                                <h2 id="detail-title" class="fw-bold mb-4">Cargando...</h2>
                                <p id="detail-desc" class="text-muted mb-4 fs-5">Por favor espera un momento.</p>
                                <div class="mt-auto">
                                    <h1 id="detail-price" class="text-success fw-bold mb-4">$0</h1>
                                    <div class="row g-2">
                                        <div class="col-12 col-sm-6">
                                            <a href="productos.html" class="btn btn-outline-light btn-lg w-100">Regresar</a>
                                        </div>
                                        <div class="col-12 col-sm-6">
                                            <button type="button" class="btn btn-success btn-lg w-100" id="detail-add-btn">Agregar al Carrito</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Offcanvas for Cart -->
        <div class="offcanvas offcanvas-end" tabindex="-1" id="cartOffcanvas" aria-labelledby="cartOffcanvasLabel" data-bs-theme="dark">
            <div class="offcanvas-header border-0 pb-0">
                <h5 class="offcanvas-title fw-bold" id="cartOffcanvasLabel">Tu Carrito</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body d-flex flex-column text-white">
                <div id="cart-items" class="flex-grow-1 overflow-auto">
                    <p class="text-center text-muted mt-4">Tu carrito está vacío.</p>
                </div>
                <div class="mt-auto border-top border-secondary pt-3">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span>Total:</span>
                        <span class="cart-total" id="cart-total">$0</span>
                    </div>
                    <button class="btn btn-success w-100" id="btn-comprar" onclick="comprar()">Comprar</button>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script src='js/app.js'></script>
    </body>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          let nombreProducto = document.getElementById('detail-title').textContent;
          let imagenProducto = document.getElementById('detail-img').src;
          let precioProducto = document.getElementById('detail-price').textContent.replace('$', '').trim();
          let categoriaProducto = document.getElementById('detail-category').textContent;
          let descripcionProducto = document.getElementById('detail-desc').textContent;
          
          if (nombreProducto && nombreProducto !== 'Cargando...') {
            const jsonLd = {
              "@context": "https://schema.org/",
              "@type": "Product",
              "name": nombreProducto,
              "image": [imagenProducto],
              "description": descripcionProducto,
              "category": categoriaProducto,
              "offers": {
                "@type": "Offer",
                "url": window.location.href,
                "priceCurrency": "USD",
                "price": precioProducto,
                "itemCondition": "https://schema.org/NewCondition",
                "availability": "https://schema.org/InStock"
              }
            };
            const scriptTag = document.createElement('script');
            scriptTag.type = 'application/ld+json';
            scriptTag.text = JSON.stringify(jsonLd);
            document.head.appendChild(scriptTag);
          }
        }, 100);
      });
    </script>

</html>
